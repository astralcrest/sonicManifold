<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>sonic manifold · node</title>
<meta name="description" content="one listener's log as 90,057 crisp squares that flow, sort, and land on their artists. five scenes, one sentence each.">
<meta name="robots" content="noindex">
<style>

*{box-sizing:border-box;margin:0;padding:0}

#lab{pointer-events:none}
body{--band:132px}
@media (max-width:720px){body{--band:168px}}
#band{position:fixed;left:0;right:0;bottom:0;height:var(--band);border-top:1px solid var(--line);background:var(--night);padding:16px 24px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:center}

#cap{font-size:clamp(15px,1.5vw,21px);line-height:1.3;font-weight:500;letter-spacing:-.01em;max-width:64ch}
#cap b{font-weight:600}
#cap .m{color:var(--mint)}#cap .a{color:var(--amber)}#cap .v{color:var(--violet)}#cap .g{color:var(--gold)}
#ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{appearance:none;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font:13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
button[aria-pressed=true]{border-color:var(--mint);color:var(--mint)}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
#dots{display:flex;gap:6px;align-items:center;margin-right:8px}
#dots i{width:6px;height:6px;border:1px solid var(--mute);display:block}
#dots i.on{background:var(--ink);border-color:var(--ink)}
#leg{display:none;gap:10px 14px;flex-wrap:wrap;font:12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);grid-column:1/-1}
#leg span{display:inline-flex;align-items:center;gap:6px}#leg i{width:8px;height:8px;display:inline-block}
body.fam #leg{display:flex}
@media (max-width:720px){#band{grid-template-columns:1fr;padding:12px 16px calc(10px + env(safe-area-inset-bottom))}#ctl{justify-content:flex-start}#cap{font-size:16px;max-width:none}#leg{font-size:11px}}
#wm{position:fixed;left:24px;top:18px;font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;pointer-events:none}
#wm b{color:var(--ink);font-weight:600}
</style>
</head>
